name: CI/CD Pipeline for Swiggy App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 596660701410.dkr.ecr.us-east-1.amazonaws.com/swiggy-app
  K8S_NAMESPACE: swiggy
  CLUSTER_NAME: swiggy-app
  K8S_DEPLOYMENT: swiggy-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests
      - name: Run tests
        run: npm test

      # Build project
      - name: Build project
        run: npm run build

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push Docker image
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "Using image tag: $IMAGE_TAG"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Update kubeconfig
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # Deploy to EKS
      - name: Deploy to EKS
        run: |
          # Get container name from deployment
          CONTAINER_NAME=$(kubectl get deployment $K8S_DEPLOYMENT -n $K8S_NAMESPACE -o=jsonpath='{.spec.template.spec.containers[0].name}')
          
          # Update deployment with new image
          kubectl set image deployment/$K8S_DEPLOYMENT $CONTAINER_NAME=$ECR_REPOSITORY:$IMAGE_TAG -n $K8S_NAMESPACE
          
          # Wait for rollout to finish (10 minutes timeout)
          kubectl rollout status deployment/$K8S_DEPLOYMENT -n $K8S_NAMESPACE --timeout=600s
          
          # Optional: clean up stuck pods (ImagePullBackOff / CrashLoopBackOff)
          STUCK_PODS=$(kubectl get pods -n $K8S_NAMESPACE \
            -o json | jq -r '.items[] | select(.status.containerStatuses[].state.waiting.reason=="ImagePullBackOff" or .status.containerStatuses[].state.waiting.reason=="CrashLoopBackOff") | .metadata.name')
          
          if [ -n "$STUCK_PODS" ]; then
            echo "Deleting stuck pods: $STUCK_PODS"
            echo "$STUCK_PODS" | xargs -r kubectl delete pod -n $K8S_NAMESPACE
          fi
