name: CI/CD Pipeline for Swiggy App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 529589763090.dkr.ecr.us-east-1.amazonaws.com/my-app-repo
  K8S_DEPLOYMENT_PATH: k8s

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IAM }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IAM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "Using image tag: $IMAGE_TAG"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update deployment image
        run: |
          sed -i "s|image: .*|image: $ECR_REPOSITORY:$IMAGE_TAG|g" $K8S_DEPLOYMENT_PATH/deployment.yaml

      - name: Commit updated deployment
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add $K8S_DEPLOYMENT_PATH/deployment.yaml
          git commit -m "Update deployment image to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push
