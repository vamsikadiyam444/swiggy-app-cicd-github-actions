name: CI/CD Pipeline for Swiggy App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 596660701410.dkr.ecr.us-east-1.amazonaws.com/swiggy-app
  K8S_MANIFEST_PATH: ./k8s/deployment.yaml
  K8S_NAMESPACE: swiggy
  CLUSTER_NAME: swiggy-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run tests
      - name: Run tests
        run: npm test

      # 5. Build project
      - name: Build project
        run: npm run build

      # 6. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Login to Amazon ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Build and push Docker image to ECR
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 9. Update Kubernetes manifest with the new image tag
      - name: Update Kubernetes manifest
        run: |
          if [ -f "$K8S_MANIFEST_PATH" ]; then
            sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" "$K8S_MANIFEST_PATH"
          else
            echo "Deployment manifest not found at $K8S_MANIFEST_PATH"
            exit 1
          fi

      # 10. Update kubeconfig for EKS
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # 11. Deploy to EKS
      - name: Deploy to EKS
        run: |
          kubectl set image deployment/swiggy-app swiggy-app=$ECR_REPOSITORY:$IMAGE_TAG -n $K8S_NAMESPACE
          kubectl rollout status deployment/swiggy-app -n $K8S_NAMESPACE
