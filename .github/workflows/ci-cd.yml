name: CI/CD Pipeline for Swiggy App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 596660701410.dkr.ecr.us-east-1.amazonaws.com/swiggy-app
  K8S_NAMESPACE: swiggy
  CLUSTER_NAME: swiggy-app
  K8S_DEPLOYMENT: swiggy-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js (if your app needs Node.js, remove if not)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run tests
      - name: Run tests
        run: npm test

      # 5️⃣ Build project
      - name: Build project
        run: npm run build

      # 6️⃣ Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 7️⃣ Login to Amazon ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 8️⃣ Build and push Docker image
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "Using image tag: $IMAGE_TAG"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 9️⃣ Update kubeconfig
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # 🔟 Deploy to EKS
      - name: Deploy to EKS
        run: |
          # Replace the image in deployment.yaml
          sed -i "s|PLACEHOLDER|$ECR_REPOSITORY:$IMAGE_TAG|g" deployment.yaml
          
          # Ensure namespace exists
          kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply deployment
          kubectl apply -f deployment.yaml -n $K8S_NAMESPACE

          # Optionally, wait for rollout
          kubectl rollout status deployment/$K8S_DEPLOYMENT -n $K8S_NAMESPACE
