name: CI/CD Pipeline for Swiggy App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 596660701410.dkr.ecr.us-east-1.amazonaws.com/my-app
  K8S_NAMESPACE: swiggy
  CLUSTER_NAME: my-eks-cluster
  K8S_DEPLOYMENT: swiggy-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run tests
      - name: Run tests
        run: npm test

      # 5. Build project
      - name: Build project
        run: npm run build

      # 6. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_IAM }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_IAM }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. Login to ECR (fixed)
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY

      # 8. Build and push Docker image
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "Using image tag: $IMAGE_TAG"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 9. Update deployment manifest with new image
      - name: Update deployment image
        run: |
          sed -i "s|image: .*|image: $ECR_REPOSITORY:$IMAGE_TAG|g" k8s/deployment.yaml

      # 10. Commit and push updated deployment.yaml
      - name: Commit updated deployment
        run: |
          git config user.name "GitHub Actions"
          git config user.email "vamsikadiyam444@gmail.com"
          git add k8s/deployment.yaml
          git commit -m "Update deployment image to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push

      # 11. Update kubeconfig for EKS
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # 12. Apply Kubernetes manifests
      # ArgoCD will automatically sync these, but we can apply manually if needed
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml -n $K8S_NAMESPACE
          kubectl apply -f k8s/service.yaml -n $K8S_NAMESPACE
