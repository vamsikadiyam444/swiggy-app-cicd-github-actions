apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiggy-app
  namespace: swiggy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy-app
  template:
    metadata:
      labels:
        app: swiggy-app
    spec:
      containers:
        - name: swiggy-app
          image: 529589763090.dkr.ecr.us-east-1.amazonaws.com/my-app-repo:957e199c2a39d4e9694b5f180ddeaa891e6c4405
          ports:
            - containerPort: 1234
          readinessProbe:
            httpGet:
              path: /health
              port: 1234
            initialDelaySeconds: 5
            periodSeconds: 10
